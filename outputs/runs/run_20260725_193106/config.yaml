  batch_decisions: 512
  updates_per_epoch: 32
  batch_episodes: 1
  batch_size: 512
  learning_rate: 0.0001
  grad_clip: 1.0
  log_every: 1
  validation_split: 0.0
  early_stopping: false
  run_greedy_eval: false
  use_amp: true
  output_dir: outputs\runs\run_20260725_193106\bc
