seed: 42
device: cuda
deterministic: false
pipeline:
  run_internal_sanity_checks: false
  run_internal_checks: true
  run_expert: true
  generate_demonstrations: true
  run_behavior_cloning: false
  run_rl_finetuning: false
  run_final_evaluation: true
  reuse_cached_stages: false
  allow_expert_soft_violations: false
  run_tgfps: true
  run_candidate_dataset: true
  run_candidate_ranker: true
  run_dagger: true
  dagger_rounds: 2
  run_hybrid_validation: true
  run_full9_test: true
  residual_rl:
    enabled: false
dataset:
  name: schneider
  root: dataset/Schneider/evrptw_instances
  path: dataset/Schneider/evrptw_instances
  format: schneider_txt
  use_only_this_dataset: true
  customers: 100
  instance_suffix: _21
  training_phase: all_classes
  tw_family: all
  shuffle_instances: true
  holdout_by_class:
    C:
    - c101_21
    - c104_21
    - c208_21
    R:
    - r101_21
    - r104_21
    - r211_21
    RC:
    - rc101_21
    - rc104_21
    - rc208_21
  validation_instances:
  - c103_21
  - c201_21
  - r103_21
  - r201_21
  - rc103_21
  - rc201_21
  train_instances: []
  test_instances: []
  eval_instances: []
environment:
  mask_semantics: exact_original_evrptw
  time_windows_mode: hard_original
  allow_late_service: false
  implementation: optimized
  performance:
    cache_action_masks: true
    use_optimized_mask_path: true
  action_pruning:
    enabled: true
    block_exact_noop_actions: true
  recharge_search:
    max_station_hops: 2
    use_dominance_pruning: true
expert:
  enabled: true
  lookahead_depth: 1
  critical_lookahead_only: true
  max_critical_lookahead: 5
  max_customer_candidates: 25
  max_recharge_candidates: 8
  repair_unserved: true
  repair_max_attempts: 120
behavior_cloning:
  enabled: true
  epochs: 8
  batch_decisions: 256
  updates_per_epoch: 10
  learning_rate: 0.0001
  validation_split: 0.0
  run_greedy_eval: true
  output_dir: outputs/bc
demonstrations:
  input: outputs/demonstrations/schneider21_tgfps_episodes.pt
  output: outputs/demonstrations/schneider21_tgfps_expert.pt
  mstar_cache: outputs/demonstrations/schneider21_tgfps_mstar.json
  num_workers: 2
hybrid_search:
  enabled: true
  construction:
    expert_variants: 5
    expert_variants_list:
    - edf
    - regret
    - energy
    - fleet
    - hybrid
    neural_variants: 0
    neural_variants_requested: 2
    elite_size: 8
  repair:
    regret_k:
    - 2
    - 3
    max_rounds: 8
    station_candidates: 2
    ejection_depth: 2
  alns:
    iterations: 80
    time_limit_seconds: 20.0
    segment_length: 50
    reaction_factor: 0.2
    temperature_initial: 1.0
    cooling_rate: 0.995
  neural_guidance:
    enabled: true
    deprecated_bc_guide: false
    note: Do not use bc_best_policy.pt. Use outputs/tgfps_p11/transformer_search_guide.pt
      after P11 train.
    checkpoint: C:\Users\ayoub\Desktop\Transformer_MARL_EVRP-main\outputs\tgfps_p11\transformer_search_guide.pt
    candidate_top_k: 32
    destroy_top_k: 16
    batch_candidate_scoring: true
  fleet_search:
    diversified_retries: 2
    descending_search: true
  deployed_fallback: Expert+Repair+ALNS
fleet_search:
  enabled: true
  selection_mode: hierarchical
  lexicographic: true
  expert_probes: 0
  customers_per_vehicle_lo: 12
  customers_per_vehicle_hi: 3
  tw_aware_floor: true
  extra_margin: 18
  training_fleet_mode: expert_mstar
  mstar_cache: outputs/demonstrations/schneider21_tgfps_mstar.json
  upper_bound_retries: 3
  retries_per_fleet: 4
  failures_before_stop: 2
  warm_start_from_larger_fleet: true
  cold_retry_after_warm_failure: true
  stop_upper_on_first_feasible: true
  prefer_expert_construct: true
  upper_budget_fraction: 0.45
  upper_expand_step: 6
  upper_expand_max: 48
  route_elimination: true
  set_partitioning_during_descent: true
  route_pool_recombination: true
  descend_until_failure: true
  seeds:
  - 0
  - 1
  - 2
  - 3
deterministic_fps_budget:
  upper_bound_fraction: 0.4
  fleet_descent_fraction: 0.25
  route_pool_fraction: 0.08
  charging_fraction: 0.08
  repair_alns_fraction: 0.14
  rescue_fraction: 0.05
problem:
  allow_partial_charging: true
  charging_portions:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true
cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_charging_price: 0.0
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0
model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.05
  use_ev_communication: true
  use_dynamic_candidate_encoder: true
  use_edge_aware_encoder: false
  torch_compile: false
rl:
  enabled: false
training:
  cycles: 0
decoding:
  mode: greedy
  max_steps_factor: 4
evaluation:
  decoding: greedy
  run_after_training: true
outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
initialization:
  load_actor: false
  load_critic: false
gpu:
  use_amp: true
  cudnn_benchmark: true
  allow_tf32: true
cpu:
  torch_num_threads: 0
  parallel_reserve: 1
