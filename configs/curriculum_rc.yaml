# RC-only curriculum: small instances (C5/C10/C15) first, then full (_21).
#
#   python main_train.py --config configs/curriculum_rc.yaml --curriculum

seed: 42
device: auto

dataset:
  path: dataset/evrptw_instances
  train_ratio: 0.8
  train_size_filter: null
  eval_size_filter: null

problem:
  load_capacity: 100.0          # RC instances had C=1000; tighter routes with more EVs
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

fleet_search:
  enabled: true
  extra_margin: 8
  selection_mode: hierarchical

model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.1
  use_ev_communication: true

training:
  method: reinforce
  batch_size: 1
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  baseline: greedy_rollout
  baseline_beta: 0.9
  reward_scale: 1000.0
  normalize_advantage: true
  served_progress_bonus: 25.0   # training-only bonus for served_ratio
  early_stop_patience: 5        # stop after 5 validations without score improvement
  validate_every: 10
  val_max_per_class: null
  run_final_eval: true
  log_every: 1

curriculum:
  mode: rc_size
  train_classes: [RC]
  cycles_small: 3               # passes over all RC C5/C10/C15 train instances
  cycles_full: 5                # passes over all RC _21 train instances
  shuffle_within_class: false
  extra_margin_by_class:
    RC: 8

decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 10          # 1000 steps on 100-customer instances

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

evaluation:
  decoding: greedy
  multi_sample_n: 16
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
