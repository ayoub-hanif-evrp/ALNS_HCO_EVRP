# Legacy alias — use configs/curriculum_hanif.yaml (all classes, converted data).
# Kept for backward compatibility with existing commands.

seed: 42
device: cuda
deterministic: false

dataset:
  path: dataset/converted_hanif_data
  train_ratio: 0.8
  train_size_filter: null
  eval_size_filter: null

problem:
  # Keep null — per-instance load in summary.json (200 / 700 / 1000); battery=600.
  load_capacity: null
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

fleet_search:
  enabled: true
  extra_margin: 12
  selection_mode: hierarchical

model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.1
  use_ev_communication: true
  edge_features: [distance, travel_time, energy]
  edge_bias_hidden_dim: 64
  edge_bias_per_head: true

training:
  method: actor_critic
  batch_size: 1
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  reward_scale: 1000.0
  early_stop_patience: 8
  early_stop_metric: feasibility
  validate_every: 10
  val_max_per_class: 2
  run_final_eval: true
  log_every: 1

rl:
  gamma: 1.0
  critic_coef: 0.5
  q_critic_coef: 0.5
  critic_learning_rate: 0.0001
  gae_lambda: 0.95
  counterfactual_mix: 0.5
  potential_eta_served: 5.0
  potential_eta_remaining_demand: 2.0
  potential_eta_battery_risk: 3.0
  potential_eta_time_risk: 3.0
  battery_safe_ratio: 0.2
  pomo_K: 4
  pomo_mix_rho: 0.1
  normalize_advantages: true

curriculum:
  mode: progressive
  train_classes: [C, R, RC]
  class_order: [C, RC, R]
  cycles_small: 3
  cycles_full: 2
  cycles_by_class:
    C:
      small: 3
      full: 2
    RC:
      small: 2
      full: 2
    R:
      small: 2
      full: 2
  shuffle_within_class: false
  reload_phase_checkpoint: true
  min_class_feasibility:
    C: 0.25
  gate_max_retries: 2
  extra_margin_by_class:
    C: 10
    RC: 12
    R: 12

decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 12

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_charging_price: 1.0
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

evaluation:
  decoding: greedy
  multi_sample_n: 16
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
