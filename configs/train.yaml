# =============================================================================
# MAIN TRAINING — Schneider EVRPTW, R class, full (_21) instances
#   python main_train.py
#   python main_dashboard.py
#
# Train: 20 R _21 instances × 20 passes = 400 epochs (sequential, no eval).
# Held out for later testing: r101_21, r104_21, r209_21
# =============================================================================

seed: 42
device: cuda
deterministic: false

dataset:
  path: dataset/Schneider/evrptw_instances
  train_size_filter: ["_21"]
  eval_size_filter: ["_21"]
  train_instances:
    - r102_21
    - r103_21
    - r105_21
    - r106_21
    - r107_21
    - r108_21
    - r109_21
    - r110_21
    - r111_21
    - r112_21
    - r201_21
    - r202_21
    - r203_21
    - r204_21
    - r205_21
    - r206_21
    - r207_21
    - r208_21
    - r210_21
    - r211_21
  eval_instances:
    - r101_21
    - r104_21
    - r209_21

training:
  method: actor_critic
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  batch_size: 1
  passes: 20
  shuffle_within_pass: false
  reward_scale: 1000.0
  log_every: 1
  checkpoint_every: 20
  dashboard_ma_window: 20
  min_decisions_warn: 10
  use_amp: true
  gradient_accumulation_steps: 1

rl:
  gamma: 1.0
  critic_coef: 0.5
  q_critic_coef: 0.5
  critic_learning_rate: 0.0001
  gae_lambda: 0.95
  counterfactual_mix: 0.5
  potential_eta_served: 5.0
  potential_eta_remaining_demand: 2.0
  potential_eta_battery_risk: 3.0
  potential_eta_time_risk: 3.0
  battery_safe_ratio: 0.2
  use_pomo: false
  pomo_K: 1
  pomo_mix_rho: 0.1
  normalize_advantages: true
  use_counterfactual_critic: false
  detach_critic_inputs: true

model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.1
  use_ev_communication: true
  use_edge_aware_encoder: false
  edge_features: [distance, travel_time, energy]
  edge_bias_hidden_dim: 64
  edge_bias_per_head: true

decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 10

problem:
  load_capacity: 100.0
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_charging_price: 1.0
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

fleet_search:
  enabled: true
  extra_margin: 6
  selection_mode: hierarchical

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
