# =============================================================================
# MAIN TRAINING CONFIG — edit the TUNABLE section, then run:
#   python main_train.py
#   python main_dashboard.py   (second terminal, while training)
# =============================================================================
#
# What one run does (NOT a single pass over the dataset):
#   Progressive curriculum C → RC → R on the 80% TRAIN split only.
#   Each step = 1 training instance + 1 REINFORCE update (~15–60 s on GPU).
#   "small" = series-1 instances (~10 customers), "full" = series-2 (1000 customers).
#   Each instance is repeated `cycles` times per tier.
#
#   Default schedule ≈ 102 steps total:
#     C:  6 small × 3 cycles + 7 full × 2 = 32
#     RC: 7 small × 2 cycles + 8 full × 2 = 30
#     R:  10 small × 2 cycles + 10 full × 2 = 40
#
#   Checkpoints: outputs/checkpoints/last.pt (final), phase_C_best.pt, …
#   Evaluate after training: python main_evaluate.py --checkpoint outputs/checkpoints/last.pt

# --- TUNABLE: hardware & reproducibility -------------------------------------
seed: 42
device: cuda          # cuda | cpu | auto
deterministic: false  # true = slower but reproducible

# --- TUNABLE: optimizer & REINFORCE ------------------------------------------
training:
  method: reinforce
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  batch_size: 1
  baseline: moving_average   # moving_average | greedy_rollout (2× slower)
  baseline_beta: 0.9
  reward_scale: 1000.0
  normalize_advantage: true
  served_progress_bonus: 50.0
  log_every: 1
  validate_during_training: false  # keep false; use main_evaluate.py after training
  validate_every: 0
  val_max_per_class: 2
  run_final_eval: false
  early_stop_patience: 8
  early_stop_metric: feasibility

# --- TUNABLE: curriculum length (main “epoch” control) -----------------------
curriculum:
  mode: progressive
  train_classes: [C, R, RC]
  class_order: [C, RC, R]
  shuffle_within_class: false
  reload_phase_checkpoint: true
  # Repeat each train instance this many times per size tier:
  cycles_by_class:
    C:
      small: 3
      full: 2
    RC:
      small: 2
      full: 2
    R:
      small: 2
      full: 2
  cycles_small: 3   # fallback if a class is missing from cycles_by_class
  cycles_full: 2
  min_class_feasibility: {}
  gate_max_retries: 2
  extra_margin_by_class:
    C: 10
    RC: 12
    R: 12

# --- TUNABLE: model size -----------------------------------------------------
model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.1
  use_ev_communication: true

# --- TUNABLE: rollout during training ----------------------------------------
decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 12

# --- TUNABLE: dataset split --------------------------------------------------
dataset:
  path: dataset/converted_hanif_data
  train_ratio: 0.8
  train_size_filter: null   # e.g. ["C1_10_1"] for a quick debug run
  eval_size_filter: null

# --- Advanced: problem & cost (usually leave as-is) --------------------------
problem:
  load_capacity: null
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_charging_price: 1.0
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

fleet_search:
  enabled: true
  extra_margin: 12
  selection_mode: hierarchical

evaluation:
  decoding: greedy
  multi_sample_n: 16
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
