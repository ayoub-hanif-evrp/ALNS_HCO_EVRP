# Progressive size curriculum (full C → RC → R path):
# For the recommended training path, use configs/curriculum_c_rc.yaml instead (C→RC only,
# phase checkpoints, C feasibility gate before full tier, early stop on feasibility).
#
#   python main_train.py --config configs/curriculum_progressive.yaml --curriculum
#   python main_dashboard.py --config configs/curriculum_progressive.yaml

seed: 42
device: cuda
deterministic: false

dataset:
  path: dataset/evrptw_instances
  train_ratio: 0.8
  train_size_filter: null
  eval_size_filter: null

problem:
  load_capacity: 100.0
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

fleet_search:
  enabled: true
  extra_margin: 8
  selection_mode: hierarchical

model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.1
  use_ev_communication: true

training:
  method: reinforce
  batch_size: 1
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  baseline: greedy_rollout
  baseline_beta: 0.9
  reward_scale: 1000.0
  normalize_advantage: true
  served_progress_bonus: 25.0
  early_stop_patience: 8
  validate_every: 10
  val_max_per_class: null
  run_final_eval: true
  log_every: 1

curriculum:
  mode: progressive
  train_classes: [C, R, RC]
  class_order: [C, RC, R]
  cycles_small: 4
  cycles_full: 3
  cycles_by_class:
    C:
      small: 4
      full: 3
    RC:
      small: 3
      full: 2
    R:
      small: 3
      full: 2
  shuffle_within_class: false
  extra_margin_by_class:
    C: 6
    RC: 8
    R: 8

decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 10

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

evaluation:
  decoding: greedy
  multi_sample_n: 16
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
