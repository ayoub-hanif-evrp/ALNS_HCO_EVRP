# Curriculum configuration for the Multi-Agent Transformer E-VRPTW solver.
#
# Phase 0 (env + mask checks) runs first, then cyclic training:
#   all C instances → all R → all RC, repeated 5 times.
#   One instance = one iteration (epoch).

seed: 42
device: cuda  # auto | cpu | cuda
deterministic: false

dataset:
  path: dataset/evrptw_instances
  train_ratio: 0.8
  train_size_filter: null
  eval_size_filter: null

problem:
  load_capacity: 100.0          # C — tighter routes, more EVs, less TW overload per trip
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

fleet_search:
  enabled: true
  extra_margin: 6            # validation/eval search m in [m_min, m_min + 6] (higher after C=100)
  selection_mode: hierarchical

model:
  embedding_dim: 192      # was 128 — ~2.7× params, medium capacity
  encoder_layers: 4       # was 3
  heads: 8
  feedforward_dim: 768    # was 512 (4× embedding_dim)
  dropout: 0.1
  use_ev_communication: true
  edge_features: [distance, travel_time, energy]
  edge_bias_hidden_dim: 64
  edge_bias_per_head: true

training:
  method: actor_critic
  batch_size: 8
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  reward_scale: 1000.0
  validate_every: 10
  val_max_per_class: null
  hard_fraction: 0.5
  hard_share: 0.5
  run_final_eval: true
  log_every: 1

rl:
  gamma: 1.0
  critic_coef: 0.5
  q_critic_coef: 0.5
  critic_learning_rate: 0.0001
  gae_lambda: 0.95
  counterfactual_mix: 0.5
  potential_eta_served: 5.0
  potential_eta_remaining_demand: 2.0
  potential_eta_battery_risk: 3.0
  potential_eta_time_risk: 3.0
  battery_safe_ratio: 0.2
  pomo_K: 4
  pomo_mix_rho: 0.1
  normalize_advantages: true

# Curriculum: cyclic instance schedule (C → R → RC, repeat 5 times).
# One pass over one instance = one training iteration (epoch).
curriculum:
  mode: cyclic
  class_order: [C, R, RC]
  cycles: 5
  shuffle_within_class: false
  extra_margin_by_class:
    C: 4
    R: 4
    RC: 6

decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 6

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

evaluation:
  decoding: greedy           # validation/eval decoding: greedy | multi_sample
  multi_sample_n: 16
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
