# Fixed mini curriculum: exactly 5 C + 5 RC + 5 R instances, repeated each cycle.
#   python main_train.py --config configs/train_fixed15.yaml --curriculum
#   python main_dashboard.py --config configs/train_fixed15.yaml
#   python main_evaluate.py --config configs/train_fixed15.yaml --checkpoint outputs/checkpoints/last.pt

seed: 42
device: cuda
deterministic: false

dataset:
  path: dataset/Schneider/evrptw_instances
  # Leave empty to auto-pick first 5 per class (sorted by name); or list exact names:
  fixed_train_instances: {}

training:
  method: actor_critic
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  batch_size: 1
  reward_scale: 1000.0
  validate_during_training: false
  validate_every: 0
  run_final_eval: false
  log_every: 1
  min_decisions_warn: 10

rl:
  gamma: 1.0
  critic_coef: 0.5
  q_critic_coef: 0.5
  critic_learning_rate: 0.0001
  gae_lambda: 0.95
  counterfactual_mix: 0.5
  potential_eta_served: 5.0
  potential_eta_remaining_demand: 2.0
  potential_eta_battery_risk: 3.0
  potential_eta_time_risk: 3.0
  battery_safe_ratio: 0.2
  pomo_K: 4
  pomo_mix_rho: 0.1
  normalize_advantages: true

curriculum:
  mode: fixed_mini
  train_classes: [C, R, RC]
  class_order: [C, RC, R]
  shuffle_within_class: false
  cycles_by_class:
    C: 200
    RC: 200
    R: 200
  extra_margin_by_class:
    C: 10
    RC: 12
    R: 12

model:
  embedding_dim: 192
  encoder_layers: 4
  heads: 8
  feedforward_dim: 768
  dropout: 0.1
  use_ev_communication: true
  edge_features: [distance, travel_time, energy]
  edge_bias_hidden_dim: 64
  edge_bias_per_head: true

decoding:
  mode: sampling
  multi_sample_n: 16
  max_steps_factor: 12

problem:
  load_capacity: null
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_charging_price: 1.0
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

fleet_search:
  enabled: true
  extra_margin: 12
  selection_mode: hierarchical

evaluation:
  decoding: greedy
  multi_sample_n: 16
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
