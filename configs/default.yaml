# Default configuration for the Multi-Agent Transformer E-VRPTW solver.

seed: 42
device: cuda  # auto | cpu | cuda — verify GPU: python scripts/check_gpu.py
deterministic: false

dataset:
  path: dataset/evrptw_instances
  train_ratio: 0.8
  # Optional substring filters to restrict which instances are used.
  # e.g. ["C5", "C10"] trains only on the small reduced instances.
  train_size_filter: null
  eval_size_filter: null

problem:
  load_capacity: 100.0
  allow_partial_charging: true
  charging_portions: [0.25, 0.50, 0.75, 1.00]
  station_reusable: true
  use_depot_charging: true
  use_horizon_check: true

fleet_search:
  enabled: true
  extra_margin: 6
  selection_mode: hierarchical  # hierarchical | scalar

model:
  embedding_dim: 192      # was 128 — ~2.7× params, medium capacity
  encoder_layers: 4       # was 3
  heads: 8
  feedforward_dim: 768    # was 512 (4× embedding_dim)
  dropout: 0.1
  use_ev_communication: true
  edge_features: [distance, travel_time, energy]
  edge_bias_hidden_dim: 64
  edge_bias_per_head: true

training:
  method: actor_critic
  epochs: 100
  batch_size: 8
  learning_rate: 0.0001
  entropy_coef: 0.01
  grad_clip: 1.0
  reward_scale: 1000.0
  use_fleet_search: false
  checkpoint_every: 10
  log_every: 1

rl:
  gamma: 1.0
  critic_coef: 0.5
  q_critic_coef: 0.5
  critic_learning_rate: 0.0001
  gae_lambda: 0.95
  counterfactual_mix: 0.5
  potential_eta_served: 5.0
  potential_eta_remaining_demand: 2.0
  potential_eta_battery_risk: 3.0
  potential_eta_time_risk: 3.0
  battery_safe_ratio: 0.2
  pomo_K: 4
  pomo_mix_rho: 0.1
  normalize_advantages: true

decoding:
  mode: sampling  # greedy | sampling | multi_sample
  multi_sample_n: 16
  max_steps_factor: 6

cost:
  lambda_vehicle: 1000.0
  lambda_distance: 1.0
  lambda_duration: 0.1
  lambda_charging: 0.5
  lambda_charging_price: 1.0
  lambda_waiting: 0.1
  penalty_unserved: 10000.0
  penalty_duplicate: 10000.0
  penalty_late: 5000.0
  penalty_battery: 10000.0
  penalty_capacity: 10000.0
  penalty_depot: 10000.0
  penalty_infeasible: 100000.0
  penalty_reserved: 10000.0

evaluation:
  decoding: greedy
  multi_sample_n: 16
  local_search:
    max_iterations: 50
  save_routes: true
  save_figures: true

outputs:
  root: outputs
  checkpoints: outputs/checkpoints
  figures: outputs/figures
  logs: outputs/logs
  results: outputs/results
  routes: outputs/routes
